<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f172a" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<title>MYSQL QUEST</title>
<meta name="description" content="Interactive Database Learning Game untuk Mata Kuliah Database MySQL (OBE)" />

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗄️</text></svg>" />

<!-- CodeMirror (SQL editor) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.css" integrity="sha384-phfEUVAmRZV1Pzn/Xgxc3NH6zPMDuer0wHU9jRQKhNBBLyV4MP1gaBY1sxfxxPRT" crossorigin="anonymous" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/theme/dracula.min.css" integrity="sha384-x8lRPRQIKDM8OaOd48WULD2bM7Ek4keq8dc8Czoge+6Pa0L7SuAsng4I4HyFI4kQ" crossorigin="anonymous" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/hint/show-hint.min.css" integrity="sha384-S4UBk64rtla3i7jU1OfBBBgD1T+Si880BgZxMhvlqibC7+rpycLVw+mnhfS0RZ0L" crossorigin="anonymous" />

<link rel="stylesheet" href="css/style.css" />
<script>
(function () {
  try {
    var v = localStorage.getItem("mysqlquest_theme");
    if (v === "light" || v === "dark") document.documentElement.setAttribute("data-theme", v);
  } catch (e) {}
})();
</script>
</head>
<body>

<div id="app" class="app"></div>

<div id="toast-root" class="toast-root" aria-live="polite"></div>

<!-- CodeMirror core + SQL mode + hint addon -->
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.js" integrity="sha384-CtBuRlcKITyrd+aBeTPNFB1/T8+kvtNQiWMCLtiGvD6NpLOJAdt8e8PpJJ2Gn1D0" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/sql/sql.min.js" integrity="sha384-wvBaGXZ3NTG46mWz1MRbZOzVCSKArTK8YzrxhZgLApKaQVFGZZXbRtBu2NTKgDlP" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/hint/show-hint.min.js" integrity="sha384-4/Pls6PVcvwrEwQW+NNalPikGxQqWc/vC/epwgbcYTKNy+5Zy5ZLBnEPdy7rYQJQ" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/hint/sql-hint.min.js" integrity="sha384-Ukde+6Ar1o7AKBNc4n0hzHbsz/7ixH+XDl7CfScR/XYxCBmiXHZLe4Xjv4CLOT8R" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/edit/matchbrackets.min.js" integrity="sha384-Q1bXASnJgEhS8C0bKSZQRYmnyQjuG47fXyPqdh1c4iUD9giCdSmXiS6hAb00VnK3" crossorigin="anonymous"></script>

<!-- sql.js (SQLite compiled to WebAssembly) -->
<script src="https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/sql-wasm.js" integrity="sha384-8D3Rsfo535FqoC1pHCCQMrNf75UgzyoG/HQm9zOzITRrz3QKzecc2E7JXKGCXoWu" crossorigin="anonymous"></script>

<!-- QR code generator (for the certificate's verification signature) -->
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js" integrity="sha384-8FWZA6BGMXhsfO+BLtrJK0We6gg5o1JyO8xQm6peWDEUs17ACA5ziE/NIAkl9z2k" crossorigin="anonymous"></script>

<script type="module" src="js/app.js"></script>
<script>
// Offline support (see sw.js). Failure to register is harmless.
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>
</body>
</html>
